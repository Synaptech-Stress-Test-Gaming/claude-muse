<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse 2 Control Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --cyan:#35e6ff; --blue:#4aa8ff; --violet:#9a6bff; --magenta:#d05cff; --pink:#ff4d9d;
  --text:#e9f1ff; --dim:#9fb2e6; --lav:#b7a6ff;
  --good:#37ffb6; --fair:#ffd166; --poor:#ff5c7a;
  --font:"Segoe UI","Bahnschrift","Trebuchet MS",system-ui,sans-serif;
  --poly:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
  --poly2:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#02030f;color:var(--text);font-family:var(--font);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;background:#02030f url(cosmic-bg.jpg) 0 0/1672px 941px no-repeat;overflow:hidden}
:where(#stage) *{position:absolute}
#stage .flow{position:static}
.cov{background:linear-gradient(180deg,#02104f,#010a3a)}
.cov.dark{background:linear-gradient(180deg,#010a33,#01062a)}
.cov.bar{background:linear-gradient(180deg,#071565,#020b45)}
.t{white-space:nowrap}
.dim{color:var(--dim)}

/* header pill */
#lamp{left:18px;top:15px;width:15px;height:15px;transform:rotate(45deg);border:2px solid var(--poor);background:transparent;box-shadow:0 0 10px var(--poor)}
#lamp.on{background:var(--good);border-color:var(--good);box-shadow:0 0 12px var(--good)}
#lamp.search{background:var(--fair);border-color:var(--fair);box-shadow:0 0 12px var(--fair);animation:pulse 1.1s infinite}
#lamp.bad{border-color:var(--poor);background:rgba(255,77,157,.35);box-shadow:0 0 12px var(--poor)}
@keyframes pulse{50%{opacity:.35}}
#statusText{left:50px;top:7px;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:300;white-space:nowrap}
#rate{left:50px;top:28px;font-size:10px;letter-spacing:.04em;color:var(--dim);white-space:nowrap}

/* battery + sensors */
.blbl{left:0;top:0;font-size:10px;letter-spacing:.3em;color:var(--lav)}
.bat{left:0;top:15px;width:150px;height:14px;border:1px solid rgba(154,107,255,.8);padding:1px;background:rgba(2,6,40,.8)}
.bat i{position:static;display:block;height:100%;width:0;background:linear-gradient(90deg,#8a5bff,#3fd6ff);transition:width .6s;box-shadow:0 0 8px rgba(80,200,255,.7)}
#batText{left:160px;top:10px;font-size:15px;font-weight:300;letter-spacing:.06em}
.sensor{top:0;width:48px;height:42px;text-align:center}
.sensor .sl{left:0;top:3px;width:48px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;letter-spacing:.08em;color:var(--lav)}
.sensor .lamp{position:static;width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--lav);background:transparent}
.sensor .q{left:0;top:20px;width:48px;font-size:13px;color:#fff;font-weight:300}
.sensor.good .lamp{background:var(--good);border-color:var(--good);box-shadow:0 0 7px var(--good)}
.sensor.fair .lamp{background:var(--fair);border-color:var(--fair);box-shadow:0 0 7px var(--fair)}
.sensor.poor .lamp{background:var(--poor);border-color:var(--poor);box-shadow:0 0 7px var(--poor)}

/* band rows */
canvas.wave{background:linear-gradient(180deg,#020a40,#030c52);border:1px solid rgba(90,140,255,.45);box-shadow:inset 0 0 18px rgba(60,100,255,.25)}
.rd{font-size:12px;letter-spacing:.06em;color:#a9bdf0;white-space:nowrap}
.sliderbox .sn{left:9px;top:3px;font-size:10px;letter-spacing:.24em;color:var(--lav)}
.sliderbox .sv{right:8px;top:2px;font-size:12px;color:#fff;font-weight:300}
.sliderbox input{left:6px;top:20px;width:238px}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:2px;background:linear-gradient(90deg,#6a4dff,#a9c8ff var(--p,100%),rgba(50,70,170,.55) var(--p,100%));box-shadow:0 0 8px rgba(110,140,255,.55)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:30px;margin-top:-11px;background:linear-gradient(180deg,#fff,#a9d0ff);box-shadow:0 0 12px #6fb0ff;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%)}
input[type=range]:focus{outline:none}
.rowdim{opacity:.45}

/* octagon buttons */
.oct{border:0;background:none;color:var(--fg,#fff);font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  text-transform:uppercase;font-weight:300;filter:drop-shadow(0 0 4px var(--glow,rgba(110,150,255,.7)));transition:transform .05s}
.oct{isolation:isolate}
.oct::before,.oct::after{content:"";position:absolute;pointer-events:none;z-index:-1}
.oct::before{inset:0;background:var(--bd,#6a8cff);clip-path:var(--poly)}
.oct::after{inset:2px;background:var(--bg,linear-gradient(180deg,#07104f,#030a38));clip-path:var(--poly2)}
.oct>*{position:relative;z-index:1}
.oct:hover:not(:disabled){--bg:linear-gradient(180deg,#1a2f9a,#0a1a70);--glow:rgba(130,200,255,.95)}
.oct:active:not(:disabled){transform:scale(.97)}
.oct:disabled{opacity:.38;cursor:not-allowed;filter:none}
.oct.on{--bg:linear-gradient(180deg,#14509a,#0a2f78);--bd:#35e6ff;--glow:rgba(53,230,255,.95)}
.oct svg{position:relative;width:24px;height:24px;flex:none}
.mute{width:112px;height:54px;font-size:16px;letter-spacing:.22em;--fg:#eaf0ff}
.bigbtn{height:66px;font-size:17px;letter-spacing:.2em}
.smallbtn{width:124px;height:34px;font-size:10.5px;letter-spacing:.14em;gap:6px;--poly:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);--poly2:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.smallbtn svg{width:15px;height:15px}

/* focus */
.fname{font-size:22px;letter-spacing:.3em;font-weight:300;color:#fff}
.fform{font-size:13px;letter-spacing:.12em;color:#8fd8ff}
#fnote{font-size:10.5px;line-height:1.25;color:#cfdcff;width:236px;white-space:normal}
#fnum{font-size:27px;font-weight:300;color:#fff;text-shadow:0 0 12px rgba(120,160,255,.9)}
#fbar{display:flex;align-items:flex-end;gap:4px}
#fbar span{position:static;flex:1;background:rgba(60,50,190,.45);border:1px solid rgba(140,120,255,.55);transition:background .2s}
#fbar span.lit{background:linear-gradient(0deg,#9a4bff,#3fd6ff 70%,#fff);border-color:#7fe6ff;box-shadow:0 0 8px rgba(80,210,255,.8)}

/* side panels */
.ptitle{font-size:10.5px;letter-spacing:.26em;color:var(--lav);white-space:nowrap}
.pk{font-size:9.5px;letter-spacing:.14em;color:#8fa6e6;white-space:nowrap}
.pv{font-size:14px;font-weight:300;color:#fff;white-space:nowrap}

/* raw overlay */
#rawov{left:246px;top:250px;width:1166px;height:404px;display:none;background:linear-gradient(180deg,#030c44,#020733);border:1.5px solid rgba(90,174,255,.7);box-shadow:0 0 22px rgba(58,134,255,.45),inset 0 0 30px rgba(60,100,255,.25)}
#rawov.show{display:block}
.rawrow .nm{left:18px;top:24px;font-size:22px;letter-spacing:.24em;font-weight:300}
.rawrow .sb{left:18px;top:54px;font-size:11px;letter-spacing:.14em;color:var(--blue)}
.rawrow .un{left:18px;top:72px;font-size:10.5px;color:var(--dim)}
.rawrow .st{left:924px;top:12px;font-size:11px;letter-spacing:.1em;color:#cfdcff;line-height:1.7;white-space:nowrap}
.rawrow .st b{font-weight:300;color:#fff;font-size:15px;letter-spacing:.04em}

/* messages */
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:none;align-items:flex-start;gap:12px;z-index:9;max-width:min(780px,88vw);
  padding:12px 20px;border:1px solid var(--poor);border-radius:6px;font-size:14px;line-height:1.45;color:#ffe3ea;
  background:linear-gradient(90deg,rgba(90,10,45,.96),rgba(34,8,60,.96));box-shadow:0 0 22px rgba(255,70,120,.5)}
#toast *{position:static}
#toast svg{width:24px;height:24px;flex:none;color:var(--poor)}
#toast.info{border-color:var(--cyan);color:#e6faff;background:linear-gradient(90deg,rgba(10,50,100,.96),rgba(20,20,70,.96));box-shadow:0 0 22px rgba(56,225,255,.45)}
#toast.info svg{color:var(--cyan)}
</style>
</head>
<body>
<div id="stage">
  <!-- header status (inside the baked status pill) -->
  <div class="cov dark" style="left:506px;top:150px;width:276px;height:46px"></div>
  <div style="left:506px;top:150px;width:276px;height:46px"><div id="lamp" class="bad"></div><div id="statusText" class="t">Starting</div><div id="rate" class="t"></div></div>

  <!-- battery -->
  <div class="cov bar" style="left:968px;top:234px;width:228px;height:46px"></div>
  <div style="left:974px;top:238px;width:218px;height:42px"><div class="blbl t">BATTERY</div><div class="bat"><i id="batFill"></i></div><div id="batText" class="t">--</div></div>
  <!-- sensors -->
  <div class="cov dark" style="left:1198px;top:229px;width:204px;height:52px"></div>
  <div id="sensors" style="left:1204px;top:238px;width:196px;height:42px"></div>

  <!-- band rows: covers + live elements are built by script -->

  <!-- raw view -->

  <!-- focus -->
  <div class="cov dark" style="left:290px;top:686px;width:252px;height:68px"></div>
  <div class="fname t" style="left:298px;top:688px">FOCUS</div>
  <div class="fform t" style="left:300px;top:716px">ln( &beta; &divide; &alpha; )</div>
  <div id="fnote" style="left:300px;top:733px">Connect to use focus</div>
  <div class="cov bar" style="left:546px;top:672px;width:508px;height:80px"></div>
  <div id="fnum" class="t" style="left:552px;top:704px">--</div>
  <div id="fbar" style="left:606px;top:680px;width:428px;height:64px"></div>
  <div class="cov dark" style="left:1068px;top:688px;width:328px;height:60px"></div>
  <button class="oct" id="btnCal" disabled style="left:1076px;top:692px;width:312px;height:52px;--fg:#cfe7ff;--bd:#4aa8ff;font-size:11.5px;letter-spacing:.16em;line-height:1.35;gap:14px">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6fd0ff" stroke-width="1.6" stroke-linecap="round" style="width:26px;height:26px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>AUTO SET BASELINES<br>10 SECONDS</span></button>

  <!-- primary controls -->
  <div class="cov" style="left:290px;top:779px;width:244px;height:86px"></div>
  <div class="cov dark" style="left:578px;top:779px;width:248px;height:86px"></div>
  <div class="cov" style="left:868px;top:779px;width:236px;height:86px"></div>
  <div class="cov dark" style="left:1138px;top:779px;width:248px;height:86px"></div>
  <button class="oct bigbtn" id="btnConnect" style="left:296px;top:793px;width:232px;--fg:#35e6ff;--bd:#35e6ff;--glow:rgba(53,230,255,.9);--bg:linear-gradient(180deg,#0a3a9a,#04186a)">
    <svg viewBox="0 0 24 24" style="width:34px;height:34px"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg><span>Connect</span></button>
  <button class="oct bigbtn" id="btnDisconnect" disabled style="left:584px;top:793px;width:236px;--fg:#a9b8ee;--bd:#5f78d8;--glow:rgba(110,140,255,.6)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:28px;height:28px"><circle cx="12" cy="12" r="9"/><path d="M9 14a2.2 2.2 0 0 0 3.1 0l1.6-1.6a2.2 2.2 0 0 0-3.1-3.1l-.5.5M14 10a2.2 2.2 0 0 0-3.1 0L9.3 11.6a2.2 2.2 0 0 0 3.1 3.1l.5-.5"/></svg><span>Disconnect</span></button>
  <button class="oct bigbtn" id="btnStart" disabled style="left:874px;top:793px;width:224px;--fg:#c9bbff;--bd:#7a62e8;--glow:rgba(255,77,157,.6);font-size:15px;line-height:1.3">
    <svg viewBox="0 0 24 24" style="width:30px;height:30px"><circle cx="12" cy="12" r="9" fill="none" stroke="#ff4d9d" stroke-width="2"/><circle cx="12" cy="12" r="4.4" fill="#ff4d9d"/></svg><span>Start<br>Recording</span></button>
  <button class="oct bigbtn" id="btnStop" disabled style="left:1144px;top:793px;width:236px;--fg:#c9bbff;--bd:#7a62e8;--glow:rgba(208,92,255,.6);font-size:15px;line-height:1.3">
    <svg viewBox="0 0 24 24" style="width:30px;height:30px"><circle cx="12" cy="12" r="9" fill="none" stroke="#d05cff" stroke-width="1.6"/><rect x="8" y="8" width="8" height="8" rx="1.4" fill="none" stroke="#d05cff" stroke-width="2"/></svg><span>Stop<br>Recording</span></button>

  <!-- left: session -->
  <div class="cov dark" style="left:64px;top:354px;width:98px;height:182px"></div>

  <!-- right: view buttons -->

  <button class="oct smallbtn" id="btnView" style="left:1465px;top:559px;--fg:#dbe8ff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h3l2-6 3 12 3-9 2 5 2-2h5"/></svg>Raw view</button>

<div id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18v.5" stroke-linecap="round"/></svg><span id="toastText"></span></div>

<script>
"use strict";
/* ============ constants ============ */
const FS = 256, PKT = 12;
const SVC = "0000fe8d-0000-1000-8000-00805f9b34fb";
const U = n => "273e" + n + "-4c4d-454d-96be-f03bac821358";
const CTRL = U("0001"), TELE = U("000b");
const EEG = [U("0003"), U("0004"), U("0005"), U("0006")];
const SENSORS = ["TP9","AF7","AF8","TP10"];
const SENSOR_SUB = ["Left ear","Left forehead","Right forehead","Right ear"];
// stage geometry follows the reference picture (1672 x 941)
const BANDS = [
  {key:"delta", name:"Delta", range:[1,4],   color:"#58b4ff", wave:[484,252,510,70], rmsY:312, L:304, mc:325},
  {key:"theta", name:"Theta", range:[4,8],   color:"#d06bff", wave:[484,336,510,69], rmsY:394, L:369, mc:398},
  {key:"alpha", name:"Alpha", range:[8,13],  color:"#35e6ff", wave:[484,421,510,66], rmsY:479, L:443, mc:473},
  {key:"beta",  name:"Beta",  range:[13,30], color:"#a58bff", wave:[484,505,510,65], rmsY:562, L:518, mc:546},
  {key:"gamma", name:"Gamma", range:[30,44], color:"#ff55e6", wave:[484,585,510,62], rmsY:643, L:592, mc:619}
];
const BUF_LEN = FS*4;
const RAW_SCALE = 200;
const params = new URLSearchParams(location.search);
const DEMO = params.get("demo") === "1", DROP = params.get("drop") === "1";
const $ = id => document.getElementById(id);

/* ============ state ============ */
const S = {
  device:null, connected:false, connecting:false, userDisconnected:false, fails:0, everConnected:false,
  maps:[new Map(),new Map(),new Map(),new Map()], seqLast:[null,null,null,null], seqAbs:[0,0,0,0],
  nextIdx:null, maxIdx:-1, alignMode:"seq", qArr:[[],[],[],[]], stall:0, lastEmitted:0,
  emitted:0, lostSamples:0, cnt:0,
  hp:[{x:0,y:0},{x:0,y:0},{x:0,y:0},{x:0,y:0}], rms:[null,null,null,null], rmsAcc:[{s:0,n:0},{s:0,n:0},{s:0,n:0},{s:0,n:0}],
  pct:[null,null,null,null], usable:4, artUntil:0,
  raw:[0,1,2,3].map(()=>new Float32Array(BUF_LEN)), rawPos:0,
  rec:null, view:"bands", pip:null, k:1
};
function biquad(f0,Q){
  const w=2*Math.PI*f0/FS, a=Math.sin(w)/(2*Q), c=Math.cos(w), a0=1+a;
  return {b0:a/a0,b2:-a/a0,a1:-2*c/a0,a2:(1-a)/a0,x1:0,x2:0,y1:0,y2:0,
    p(x){const y=this.b0*x+this.b2*this.x2-this.a1*this.y1-this.a2*this.y2;this.x2=this.x1;this.x1=x;this.y2=this.y1;this.y1=y;return y;}};
}
function makeFilters(b){const f0=Math.sqrt(b.range[0]*b.range[1]),Q=f0/(b.range[1]-b.range[0]);b.f1=biquad(f0,Q);b.f2=biquad(f0,Q);}
BANDS.forEach(b=>{b.buf=new Float32Array(BUF_LEN);b.pos=0;b.gain=1;b.muted=false;b.scale=null;b.energy=0;b.eN=0;b.power=0;b.e2=0;b.n2=0;makeFilters(b);});

/* ============ build UI on the stage ============ */
const mk=(tag,cls,css,html,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||$("bandlayer")).appendChild(e);return e;};
BANDS.forEach((b,i)=>{
  const [wx,wy,ww,wh]=b.wave;
  // covers hide the picture's sample waves, sliders and mute buttons
  mk("div","cov",`left:${wx-2}px;top:${wy-3}px;width:${ww+4}px;height:${wh+6}px`);
  mk("div","cov dark",`left:1010px;top:${b.L-17}px;width:254px;height:62px`);
  mk("div","cov dark",`left:1284px;top:${b.mc-34}px;width:126px;height:68px`);
  mk("canvas","wave",`left:${wx}px;top:${wy}px;width:${ww}px;height:${wh}px`).id="cv"+i;
  const rd=mk("div","rd",`left:285px;top:${b.rmsY-8}px`,"--");rd.id="rd"+i;
  const sb=mk("div","sliderbox",`left:1012px;top:${b.L-16}px;width:250px;height:58px`,
    `<div class="sn t">STRENGTH</div><div class="sv t" id="sv${i}">100%</div><input type="range" min="0" max="100" value="100" id="sl${i}" aria-label="${b.name} strength">`);
  const mu=mk("button","oct mute",`left:1290px;top:${b.mc-27}px;--bd:#6a8cff;--glow:rgba(110,150,255,.7)`,"Mute");mu.id="mu"+i;
  const sl=$("sl"+i),upd=()=>{b.gain=sl.value/100;$("sv"+i).textContent=sl.value+"%";sl.style.setProperty("--p",sl.value+"%");};

/* ============ stream handling (no interpolation, nothing invented) ============ */
function resetStream(){
  S.maps.forEach(m=>m.clear());S.seqLast=[null,null,null,null];S.seqAbs=[0,0,0,0];S.nextIdx=null;S.maxIdx=-1;
  S.alignMode="seq";S.qArr=[[],[],[],[]];S.stall=0;S.lastEmitted=0;S.emitted=0;S.lostSamples=0;S.cnt=0;
  S.hp.forEach(h=>{h.x=0;h.y=0;});S.rms=[null,null,null,null];S.pct=[null,null,null,null];S.rmsAcc.forEach(a=>{a.s=0;a.n=0;});
  S.raw.forEach(a=>a.fill(0));S.rawPos=0;BANDS.forEach(b=>{b.buf.fill(0);b.pos=0;b.scale=null;makeFilters(b);});
}
function handlePacket(ch,seq,vals){
  S.cnt+=vals.length;
  if(S.alignMode==="arrival"){vals.forEach(v=>S.qArr[ch].push(v));while(S.qArr.every(a=>a.length))emit(S.qArr.map(a=>a.shift()));return;}
  if(S.seqLast[ch]==null){S.seqAbs[ch]=seq;}
  else{const d=(seq-S.seqLast[ch])&0xffff;if(d===0)return;S.seqAbs[ch]+=d;}
  S.seqLast[ch]=seq;
  const base=S.seqAbs[ch]*PKT;
  for(let i=0;i<vals.length;i++)S.maps[ch].set(base+i,vals[i]);
  if(base+vals.length-1>S.maxIdx)S.maxIdx=base+vals.length-1;
  if(S.nextIdx==null){
    if(!S.maps.every(m=>m.size>0))return;
    S.nextIdx=Math.max(...S.maps.map(m=>Math.min(...m.keys())));
  }
  for(;;){
    const i=S.nextIdx;
    if(S.maps.every(m=>m.has(i))){const v=S.maps.map(m=>{const x=m.get(i);m.delete(i);return x;});S.nextIdx++;emit(v);continue;}
    if(S.maxIdx-i>60){S.maps.forEach(m=>m.delete(i));S.nextIdx++;S.lostSamples++;continue;} // a packet never arrived: skip it, do not fill it in
    break;
  }
}
function emit(vals){
  S.emitted++;
  const ys=[0,0,0,0];
  for(let c=0;c<4;c++){
    const h=S.hp[c],uv=vals[c],y=uv-h.x+0.995*h.y;h.x=uv;h.y=y;ys[c]=y; // only the constant offset is removed
    S.rmsAcc[c].s+=y*y;S.rmsAcc[c].n++;
    if(Math.abs(y)>300)S.artUntil=Date.now()+1200;
  }
  if(S.emitted<FS*2)return; // first 2 seconds: offset filter still settling, not shown
  for(let c=0;c<4;c++)S.raw[c][S.rawPos]=ys[c];
  S.rawPos=(S.rawPos+1)%BUF_LEN;
  let sum=0,n=0;
  for(let c=0;c<4;c++){const r=S.rms[c];if(r==null||(r>0.5&&r<400)){sum+=ys[c];n++;}}
  S.usable=n;
  const x=n?sum/n:0;
  for(const b of BANDS){
    const v=b.f2.p(b.f1.p(x));b.buf[b.pos]=v;b.pos=(b.pos+1)%BUF_LEN;
    b.energy+=v*v;b.eN++;b.e2+=v*v;b.n2++;
  }
  if(S.rec)S.rec.samples++;
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function setSess(running){
  if(running){const s=Math.floor((Date.now()-S.rec.t0)/1000);$("sessT").textContent=fmt(s);$("sessN").textContent=S.rec.samples.toLocaleString();$("sessM").textContent="Recording. Not saved";}
}
setInterval(()=>{
  SENSORS.forEach((nm,i)=>{
    const a=S.rmsAcc[i],rms=a.n?Math.sqrt(a.s/a.n):0;if(a.n)S.rms[i]=rms;a.s=0;a.n=0;
    let raw;
    if(rms<0.5)raw=0;else if(rms<3)raw=(rms-0.5)/2.5*100;else if(rms<=40)raw=100;else if(rms<200)raw=(200-rms)/160*100;else raw=0;
    S.pct[i]=S.pct[i]==null?raw:S.pct[i]+0.5*(raw-S.pct[i]);
    const el=$("sen"+i),q=el.querySelector(".q");let cls="",txt="--";
    if(S.connected&&S.emitted>0){const p=Math.round(S.pct[i]);txt=p+"%";cls=p>=70?"good":p>=40?"fair":"poor";}

  });

  $("rate").textContent=S.connected?(rate>0?"Live data":"Connected, waiting for data"):"";
  $("stRate").textContent=S.connected&&rate>0?Math.round(rate)+" Hz":"--";
  $("stDrop").textContent=S.connected&&tot?dp.toFixed(1)+"%":"--";
  $("stUse").textContent=S.connected&&S.emitted>FS*2?S.usable+" / 4":"--";
  if(S.connected&&rate>0){S.stall=S.emitted===S.lastEmitted?S.stall+1:0;S.lastEmitted=S.emitted;
    if(S.stall>=3&&S.alignMode==="seq"){S.alignMode="arrival";S.maps.forEach(m=>m.clear());}}
  BANDS.forEach((b,i)=>{
    b.power=b.eN?Math.sqrt(b.energy/b.eN):0;b.energy=0;b.eN=0;

  });

},1000);

/* ============ drawing ============ */
const FONT="'Segoe UI',Arial,sans-serif";
function prep(cv){const d=(window.devicePixelRatio||1)*S.k,w=cv.clientWidth,h=cv.clientHeight;
  const pw=Math.round(w*d),ph=Math.round(h*d);if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}
  const g=cv.getContext("2d");g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);return {g,w,h};}
function grid(g,w,h,label){
  g.strokeStyle="rgba(110,150,255,.18)";g.lineWidth=1;g.beginPath();
  for(let k=1;k<4;k++){const x=Math.round(w*k/4)+.5;g.moveTo(x,0);g.lineTo(x,h);}
  g.moveTo(0,h/2+.5);g.lineTo(w,h/2+.5);g.stroke();
  g.fillStyle="rgba(160,180,235,.85)";g.font="9.5px "+FONT;g.textAlign="left";g.fillText("4 s",5,h-4);g.textAlign="right";g.fillText("now",w-5,h-4);
  if(label){g.textAlign="right";g.fillText(label,w-6,11);}
}
function trace(g,w,h,buf,pos,amp,color){
  const mid=h/2,lim=h/2-2;
  const path=()=>{g.beginPath();for(let x=0;x<w;x++){const idx=(pos+Math.floor(x/w*BUF_LEN))%BUF_LEN;let v=buf[idx]*amp;v=Math.max(-lim,Math.min(lim,v));x?g.lineTo(x,mid-v):g.moveTo(x,mid-v);}};
  g.lineJoin="round";g.strokeStyle=color;g.globalAlpha=.22;g.lineWidth=4.5;path();g.stroke();
  g.globalAlpha=1;g.lineWidth=1.4;path();g.stroke();
}
function draw(){
  BANDS.forEach((b,i)=>{
    const {g,w,h}=prep($("cv"+i));
    let pk=0;for(let k=0;k<BUF_LEN;k+=2){const a=Math.abs(b.buf[k]);if(a>pk)pk=a;}
    pk=Math.max(pk,0.5);b.scale=(b.scale==null||pk>b.scale)?pk:b.scale+0.04*(pk-b.scale); // window fits the largest value of the last 4 s
    const amp=b.muted?0:b.gain*(h/2-3)/b.scale;
    const eff=b.gain>0.01?b.scale/b.gain:null;
    grid(g,w,h,b.muted?"muted":(eff?"±"+(eff<10?eff.toFixed(1):Math.round(eff))+" µV full height":"off"));
    trace(g,w,h,b.buf,b.pos,amp,b.muted?"#7f8fc0":b.color);
    if(S.connected&&S.usable===0){g.fillStyle="#ff9db0";g.font="13px "+FONT;g.textAlign="center";g.fillText("No sensor contact",w/2,h/2-6);}
  });
  if(S.view==="raw"){
    SENSORS.forEach((n,i)=>{
      const {g,w,h}=prep($("rc"+i));
      grid(g,w,h,"±"+RAW_SCALE+" µV fixed scale");
      g.strokeStyle="rgba(110,150,255,.12)";g.beginPath();const y1=h/2-(h/2-2)*100/RAW_SCALE,y2=h/2+(h/2-2)*100/RAW_SCALE;g.moveTo(0,y1);g.lineTo(w,y1);g.moveTo(0,y2);g.lineTo(w,y2);g.stroke();
      trace(g,w,h,S.raw[i],S.rawPos,(h/2-2)/RAW_SCALE,"#7fe0ff");
    });
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ============ Muse protocol ============ */
const enc=cmd=>{const b=new TextEncoder().encode("X"+cmd+"\n");b[0]=b.length-1;return b;};
function decodeEEG(dv){
  const out=[];
  for(let i=0;i<6;i++){const b=2+i*3,a=dv.getUint8(b),m=dv.getUint8(b+1),c=dv.getUint8(b+2);
    out.push((a<<4)|(m>>4),((m&15)<<8)|c);}
  return out.map(v=>(v-2048)*0.48828125); // microvolts, straight from the headband's 12-bit values
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function linkOnce(dev){
  const server=await dev.gatt.connect();
  const svc=await server.getPrimaryService(SVC);
  const ctrl=await svc.getCharacteristic(CTRL);await ctrl.startNotifications();
  for(let i=0;i<4;i++){const c=await svc.getCharacteristic(EEG[i]);
    c.addEventListener("characteristicvaluechanged",e=>{const dv=e.target.value;handlePacket(i,dv.getUint16(0),decodeEEG(dv));});
    await c.startNotifications();}
  try{const t=await svc.getCharacteristic(TELE);t.addEventListener("characteristicvaluechanged",e=>{const dv=e.target.value;if(dv.byteLength>=4)setBattery(dv.getUint16(2)/512);});await t.startNotifications();}catch(e){}
  await ctrl.writeValueWithoutResponse(enc("h"));await ctrl.writeValueWithoutResponse(enc("p21"));
  await ctrl.writeValueWithoutResponse(enc("s"));await ctrl.writeValueWithoutResponse(enc("d"));
}
const HELP="Could not link with your Muse 2. Try this: 1) Close the Muse app on any phone or tablet. 2) In Windows Settings, Bluetooth & devices, remove 'Muse' if it is listed. 3) Turn the headband off, then on again. 4) Press Connect.";
async function connectMuse(userClicked){
  if(S.connecting||S.connected)return;
  S.connecting=true;S.userDisconnected=false;setButtons();
  try{
    if(DEMO)return startDemo();
    if(!navigator.bluetooth)throw Object.assign(new Error("Bluetooth is not available in this window. Use the Open Muse Panel launcher."),{name:"NoBT"});
    setStatus("search","Searching");
    let dev=S.device;
    if(!dev){try{const known=navigator.bluetooth.getDevices?await navigator.bluetooth.getDevices():[];dev=known.find(d=>/muse/i.test(d.name||""));}catch(e){}}
    if(!dev){
      if(!userClicked){S.connecting=false;setButtons();setStatus("search","Press Connect once");return;}
      dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"Muse"}],optionalServices:[SVC]});
    }
    S.device=dev;dev.removeEventListener("gattserverdisconnected",onDrop);dev.addEventListener("gattserverdisconnected",onDrop);
    setStatus("search","Connecting");
    let lastErr=null;
    for(let a=1;a<=3;a++){
      try{resetStream();await linkOnce(dev);lastErr=null;break;}
      catch(e){lastErr=e;try{dev.gatt.disconnect();}catch(_){}await sleep(1200*a);}
    }
    if(lastErr)throw lastErr;
    S.fails=0;S.everConnected=true;S.connected=true;S.connecting=false;setStatus("on","Connected");setButtons();
  }catch(err){
    S.connecting=false;S.connected=false;setButtons();console.error(err);
    if(err&&err.name==="NotFoundError"){setStatus("search","Press Connect");return;}
    S.fails++;setStatus("bad","Not connected");
    toast(err&&err.name==="NoBT"?err.message:HELP,"error",14000);
    if(S.fails<3&&S.everConnected)scheduleRetry();
  }
}
function onDrop(){
  S.connected=false;S.connecting=false;setButtons();setBattery(null);if(S.rec)stopRec(true);
  if(S.userDisconnected){setStatus("bad","Disconnected");return;}
  setStatus("search","Lost signal, retrying");scheduleRetry();
}
let retryT=null;
function scheduleRetry(){clearTimeout(retryT);if(S.userDisconnected)return;retryT=setTimeout(()=>connectMuse(false),2500);}
function disconnectMuse(){
  S.userDisconnected=true;clearTimeout(retryT);
  if(DEMO){stopDemo();return;}
  try{if(S.device&&S.device.gatt.connected)S.device.gatt.disconnect();}catch(e){}
  S.connected=false;S.connecting=false;setButtons();setStatus("bad","Disconnected");setBattery(null);if(S.rec)stopRec(true);
}
function setBattery(p){
  if(p==null){$("batFill").style.width="0";$("batText").textContent="--";return;}
  p=Math.max(0,Math.min(100,p));$("batFill").style.width=p+"%";$("batText").textContent=Math.round(p)+"%";
}

let demoT=null,demoN=0;window.demoAlpha=28;window.demoBeta=14;
function startDemo(){

/* ============ focus ============
   F = ln( beta power / alpha power ), smoothed ~3 s.  Meter = 100 x (F - low) / (high - low), held to 0..100.
   Uses the true band signal; sliders and mutes only change what is drawn. */
const CAL_SEC=+(params.get("cal")||10),MIN_SPAN=0.4;
const focus={ema:null,fast:null,lo:null,hi:null,cal:null,result:""};
function quantile(s,q){const p=(s.length-1)*q,i=Math.floor(p),f=p-i;return s[i]+(s[Math.min(i+1,s.length-1)]-s[i])*f;}
function focusPct(){
  if(focus.ema==null||focus.lo==null||focus.hi==null||focus.hi-focus.lo<0.05)return null;
  return Math.max(0,Math.min(100,(focus.ema-focus.lo)/(focus.hi-focus.lo)*100));
}
function renderFocus(){
  const p=focusPct(),txt=p==null?"--":String(Math.round(p));
  $("fnum").textContent=txt;
  [...fbar.children].forEach((s,i)=>s.classList.toggle("lit",p!=null&&i<Math.round(p/100*FSEG)));
  let note;
  if(focus.cal)note=focus.cal.msg();
  else if(!S.connected)note="Connect to use focus";
  else if(S.usable===0)note="No sensor contact";
  else if(focus.lo==null||focus.hi==null)note=focus.result||"Press the button to set baselines";
  else note=focus.result||"Baselines set. Focus is live.";
  $("fnote").textContent=note;
  $("btnCal").disabled=!(S.connected&&!focus.cal);
  $("btnCal").classList.toggle("on",focus.lo!=null&&focus.hi!=null&&!focus.cal);
  if(S.pip){S.pip.num.textContent=txt;[...S.pip.bar.children].forEach((s,i)=>s.classList.toggle("lit",p!=null&&i<Math.round(p/100*FSEG)));S.pip.note.textContent=p==null?(S.connected?"Set baselines in the panel":"Not connected"):"";}
}
function startCal(){
  if(!S.connected||focus.cal)return;const t0=Date.now();focus.result="";
  focus.cal={t0,vals:[],all:[],msg(){const left=Math.max(0,CAL_SEC-(Date.now()-t0)/1000);return "RECORDING "+Math.ceil(left)+"s. Drift from relaxed to concentrating";}};
  renderFocus();
}
function finishCal(){
  const c=focus.cal;focus.cal=null;
  const src=c.vals.length>=20?c.vals:c.all;
  if(src.length<12){focus.result="No usable signal in the 10 seconds. Check the sensor percentages and press again.";renderFocus();return;}
  const s=[...src].sort((x,y)=>x-y),q1=quantile(s,.25),q3=quantile(s,.75),iqr=q3-q1;
  const inl=s.filter(v=>v>=q1-1.5*iqr&&v<=q3+1.5*iqr);
  let lo=quantile(inl,.10),hi=quantile(inl,.90),note="Baselines set. Focus is live.";
  if(hi-lo<MIN_SPAN){const mid=(lo+hi)/2;lo=mid-MIN_SPAN/2;hi=mid+MIN_SPAN/2;note="Baselines set (small change seen). Press again and shift your focus more for a wider range.";}
  focus.lo=lo;focus.hi=hi;focus.result=note;renderFocus();
}
setInterval(()=>{
  const a=BANDS[2],b=BANDS[3],ok=a.n2>=20&&b.n2>=20;
  const am=ok?a.e2/a.n2:0,bm=ok?b.e2/b.n2:0;a.e2=a.n2=b.e2=b.n2=0;
  if(!S.connected){focus.ema=null;focus.fast=null;focus.cal=null;renderFocus();return;}
  if(ok&&S.usable>0){
    const F=Math.log((bm+1e-3)/(am+1e-3));
    focus.ema=focus.ema==null?F:focus.ema+0.08*(F-focus.ema);
    focus.fast=focus.fast==null?F:focus.fast+0.22*(F-focus.fast);
    if(focus.cal){focus.cal.all.push(focus.fast);if(Date.now()>S.artUntil)focus.cal.vals.push(focus.fast);}
  }
  if(focus.cal&&(Date.now()-focus.cal.t0)/1000>=CAL_SEC)finishCal();
  renderFocus();
},250);
$("btnCal").addEventListener("click",startCal);

async function toggleFloat(){
  if(S.pip){S.pip.w.close();return;}
  if(!("documentPictureInPicture" in window)){toast("The floating meter needs Microsoft Edge or Chrome, version 116 or newer.","error");return;}
  try{
    const w=await documentPictureInPicture.requestWindow({width:300,height:136});
    try{w.moveTo(screen.availLeft+screen.availWidth-320,screen.availTop+8);}catch(e){}
    const st=w.document.createElement("style");st.textContent=PIP_CSS;w.document.head.appendChild(st);
    w.document.body.innerHTML=`<div class="t">FOCUS</div><div class="n" id="n">--</div><div class="b" id="b"></div><div class="s" id="s"></div>`;
    const bar=w.document.getElementById("b");for(let i=0;i<FSEG;i++){const s=w.document.createElement("span");s.style.height=(22+i*(78/(FSEG-1)))+"%";bar.appendChild(s);}
    S.pip={w,num:w.document.getElementById("n"),bar,note:w.document.getElementById("s")};
    $("btnFloat").classList.add("on");$("btnFloat").lastChild.textContent="Close float";
    w.addEventListener("pagehide",()=>{S.pip=null;$("btnFloat").classList.remove("on");$("btnFloat").lastChild.textContent="Float focus";});
    renderFocus();
    toast("Floating meter is on. Minimize this panel (do not close it) and the meter stays on top. Drag it to the top right if you like.","info",9000);
  }catch(e){console.error(e);toast("Could not open the floating meter. Press the button again.","error");}
}
$("btnFloat").addEventListener("click",toggleFloat);

/* ============ wiring ============ */
$("btnConnect").addEventListener("click",()=>connectMuse(true));
$("btnDisconnect").addEventListener("click",disconnectMuse);
$("btnStart").addEventListener("click",startRec);
$("btnStop").addEventListener("click",()=>stopRec(false));
if(params.get("view")==="raw")setView("raw");
setButtons();setStatus("search","Searching");renderFocus();
connectMuse(false);
addEventListener("beforeunload",()=>{try{if(S.device&&S.device.gatt.connected)S.device.gatt.disconnect();}catch(e){}});
</script>
