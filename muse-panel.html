<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse 2 Control Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.look=localStorage.getItem("muse2panel.look")==="clean"?"clean":"cosmic";}catch(e){document.documentElement.dataset.look="cosmic";}</script>
<style>
:root{
  --cyan:#35e6ff; --blue:#4aa8ff; --violet:#9a6bff; --magenta:#d05cff; --pink:#ff4d9d;
  --text:#e9f1ff; --dim:#9fb2e6; --lav:#b7a6ff;
  --good:#37ffb6; --fair:#ffd166; --poor:#ff5c7a;
  --font:"Segoe UI","Bahnschrift","Trebuchet MS",system-ui,sans-serif;
  --poly:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
  --poly2:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#02030f;color:var(--text);font-family:var(--font);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;background:#02030f url(cosmic-bg.jpg) 0 0/1672px 941px no-repeat;overflow:hidden}
:where(#stage) *{position:absolute}
#stage .flow{position:static}
.cov{background:linear-gradient(180deg,#02104f,#010a3a)}
.cov.dark{background:linear-gradient(180deg,#010a33,#01062a)}
.cov.bar{background:linear-gradient(180deg,#071565,#020b45)}
.t{white-space:nowrap}
.dim{color:var(--dim)}

/* header pill */
#lamp{left:18px;top:15px;width:15px;height:15px;transform:rotate(45deg);border:2px solid var(--poor);background:transparent;box-shadow:0 0 10px var(--poor)}
#lamp.on{background:var(--good);border-color:var(--good);box-shadow:0 0 12px var(--good)}
#lamp.search{background:var(--fair);border-color:var(--fair);box-shadow:0 0 12px var(--fair);animation:pulse 1.1s infinite}
#lamp.bad{border-color:var(--poor);background:rgba(255,77,157,.35);box-shadow:0 0 12px var(--poor)}
@keyframes pulse{50%{opacity:.35}}
#statusText{left:50px;top:7px;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:300;white-space:nowrap}
#rate{left:50px;top:28px;font-size:10px;letter-spacing:.04em;color:var(--dim);white-space:nowrap}

/* battery + sensors */
.blbl{left:0;top:0;font-size:10px;letter-spacing:.3em;color:var(--lav)}
.bat{left:0;top:15px;width:150px;height:14px;border:1px solid rgba(154,107,255,.8);padding:1px;background:rgba(2,6,40,.8)}
.bat i{position:static;display:block;height:100%;width:0;background:linear-gradient(90deg,#8a5bff,#3fd6ff);transition:width .6s;box-shadow:0 0 8px rgba(80,200,255,.7)}
#batText{left:160px;top:10px;font-size:15px;font-weight:300;letter-spacing:.06em}
.sensor{top:0;width:39px;height:42px;text-align:center}
.sensor .sl{left:0;top:3px;width:39px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:9px;letter-spacing:.06em;color:var(--lav)}
.sensor .lamp{position:static;width:7px;height:7px;transform:rotate(45deg);border:1.5px solid var(--lav);background:transparent}
.sensor .q{left:0;top:20px;width:39px;font-size:12px;color:#fff;font-weight:300}
.inl{position:static}
.sensor.good .lamp{background:var(--good);border-color:var(--good);box-shadow:0 0 7px var(--good)}
.sensor.fair .lamp{background:var(--fair);border-color:var(--fair);box-shadow:0 0 7px var(--fair)}
.sensor.poor .lamp{background:var(--poor);border-color:var(--poor);box-shadow:0 0 7px var(--poor)}
.sensor.hr .sl{color:#ff7088}

/* heart rate (bright red) */
.hrname{font-size:10.5px;letter-spacing:.26em;color:#ff6b81;white-space:nowrap}
#hrNum{font-size:36px;font-weight:300;color:#ff2a3d;text-shadow:0 0 14px rgba(255,40,70,.95),0 0 3px rgba(255,120,130,.9);line-height:1;white-space:nowrap}
#hrState{font-size:9.5px;letter-spacing:.14em;color:#ff9aa8;white-space:nowrap}
.hrbar{height:9px;border:1px solid rgba(255,70,90,.75);background:rgba(60,0,20,.6);padding:1px}
.hrbar i{position:static;display:block;height:100%;width:0;background:linear-gradient(90deg,#ff1f3d,#ff6a5e);box-shadow:0 0 10px rgba(255,40,70,.95);transition:width .6s}
canvas.hrcv{background:linear-gradient(180deg,#1a0212,#0c0118);border:1px solid rgba(255,70,100,.5);box-shadow:inset 0 0 12px rgba(255,40,80,.2)}

/* band rows */
canvas.wave{background:linear-gradient(180deg,#020a40,#030c52);border:1px solid rgba(90,140,255,.45);box-shadow:inset 0 0 18px rgba(60,100,255,.25)}
.rd{font-size:12px;letter-spacing:.06em;color:#a9bdf0;white-space:nowrap}
.sliderbox .sn{left:9px;top:3px;font-size:10px;letter-spacing:.24em;color:var(--lav)}
.sliderbox .sv{right:8px;top:2px;font-size:12px;color:#fff;font-weight:300}
.sliderbox input{left:6px;top:20px;width:238px}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:2px;background:linear-gradient(90deg,#6a4dff,#a9c8ff var(--p,100%),rgba(50,70,170,.55) var(--p,100%));box-shadow:0 0 8px rgba(110,140,255,.55)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:30px;margin-top:-11px;background:linear-gradient(180deg,#fff,#a9d0ff);box-shadow:0 0 12px #6fb0ff;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%)}
input[type=range]:focus{outline:none}
.rowdim{opacity:.45}

/* octagon buttons */
.oct{border:0;background:none;color:var(--fg,#fff);font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  text-transform:uppercase;font-weight:300;filter:drop-shadow(0 0 4px var(--glow,rgba(110,150,255,.7)));transition:transform .05s}
.oct{isolation:isolate}
.oct::before,.oct::after{content:"";position:absolute;pointer-events:none;z-index:-1}
.oct::before{inset:0;background:var(--bd,#6a8cff);clip-path:var(--poly)}
.oct::after{inset:2px;background:var(--bg,linear-gradient(180deg,#07104f,#030a38));clip-path:var(--poly2)}
.oct>*{position:relative;z-index:1}
.oct:hover:not(:disabled){--bg:linear-gradient(180deg,#1a2f9a,#0a1a70);--glow:rgba(130,200,255,.95)}
.oct:active:not(:disabled){transform:scale(.97)}
.oct:disabled{opacity:.38;cursor:not-allowed;filter:none}
.oct.on{--bg:linear-gradient(180deg,#14509a,#0a2f78);--bd:#35e6ff;--glow:rgba(53,230,255,.95)}
.oct svg{position:relative;width:24px;height:24px;flex:none}
.mute{width:112px;height:54px;font-size:16px;letter-spacing:.22em;--fg:#eaf0ff}
.bigbtn{height:66px;font-size:17px;letter-spacing:.2em}
.smallbtn{width:124px;height:34px;font-size:10.5px;letter-spacing:.14em;gap:6px;--poly:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);--poly2:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.smallbtn svg{width:15px;height:15px}

/* focus */
.fname{font-size:22px;letter-spacing:.3em;font-weight:300;color:#fff}
.fform{font-size:13px;letter-spacing:.12em;color:#8fd8ff}
#fnote{font-size:10.5px;line-height:1.25;color:#cfdcff;width:236px;white-space:normal}
#fmode{display:flex;gap:2px;white-space:nowrap}
#fform{font-size:11px;letter-spacing:.04em}
#fmode button{position:static!important;width:auto!important;height:auto!important;font-weight:600;font-size:7.5px;line-height:1;font-family:inherit;letter-spacing:.04em;padding:3px 3px;border:1px solid rgba(140,160,255,.55);background:rgba(20,30,110,.6);color:#9fb4ff;cursor:pointer;border-radius:3px}
#fmode button.on{background:#3fd6ff;color:#001040;border-color:#bff}
#fmode button:disabled{opacity:.4;cursor:not-allowed}
#cstat{display:inline-block;font-weight:700;letter-spacing:.04em;padding:0 4px;border-radius:3px;margin-right:4px;background:rgba(80,220,140,.25);color:#8fffc0}
#cstat.rej{background:rgba(255,90,90,.25);color:#ff9a9a}
#cstat.hold{background:rgba(255,200,80,.25);color:#ffd98a}
#fnum{font-size:27px;font-weight:300;color:#fff;text-shadow:0 0 12px rgba(120,160,255,.9)}
#fbar{display:flex;align-items:flex-end;gap:4px}
#fbar span{position:static;flex:1;background:rgba(60,50,190,.45);border:1px solid rgba(140,120,255,.55);transition:background .2s}
#fbar span.lit{background:linear-gradient(0deg,#9a4bff,#3fd6ff 70%,#fff);border-color:#7fe6ff;box-shadow:0 0 8px rgba(80,210,255,.8)}

/* side panels */
.ptitle{font-size:10.5px;letter-spacing:.26em;color:var(--lav);white-space:nowrap}
.pk{font-size:9.5px;letter-spacing:.14em;color:#8fa6e6;white-space:nowrap}
.pv{font-size:14px;font-weight:300;color:#fff;white-space:nowrap}

/* raw overlay */
#rawov{left:246px;top:250px;width:1166px;height:404px;display:none;background:linear-gradient(180deg,#030c44,#020733);border:1.5px solid rgba(90,174,255,.7);box-shadow:0 0 22px rgba(58,134,255,.45),inset 0 0 30px rgba(60,100,255,.25)}
#rawov.show{display:block}
.rawrow .nm{left:18px;top:8px;font-size:19px;letter-spacing:.24em;font-weight:300}
.rawrow .sb{left:18px;top:34px;font-size:10.5px;letter-spacing:.12em;color:var(--blue)}
.rawrow .un{left:18px;top:52px;font-size:10px;color:var(--dim)}
.rawrow .st{left:924px;top:12px;font-size:11px;letter-spacing:.1em;color:#cfdcff;line-height:1.7;white-space:nowrap}
.rawrow .st b{font-weight:300;color:#fff;font-size:15px;letter-spacing:.04em}

/* report */
#report{left:246px;top:232px;width:1166px;height:560px;display:none;z-index:8;background:linear-gradient(180deg,#050e52,#020733);border:1.5px solid rgba(90,174,255,.85);box-shadow:0 0 30px rgba(58,134,255,.55),inset 0 0 40px rgba(60,100,255,.22);padding:20px 26px;color:#e9f1ff}
#report.show{display:block}
#report,#report *{position:static}
#report{position:absolute}
#report .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
#report h2{font-size:22px;letter-spacing:.3em;font-weight:300;color:#fff}
#report .rs{font-size:12px;color:#9fb2e6;letter-spacing:.06em}
#report .cols{display:grid;grid-template-columns:1fr 1.25fr 1.25fr;gap:22px}
#report .box{border:1px solid rgba(90,140,255,.4);background:rgba(4,10,52,.7);padding:12px 14px}
#report .box h3{font-size:11px;letter-spacing:.28em;font-weight:400;color:var(--lav);margin-bottom:8px}
#report .ln{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;line-height:1.75;color:#cfdcff}
#report .ln b{font-weight:300;color:#fff;white-space:nowrap}
#report table{width:100%;border-collapse:collapse;font-size:12px}
#report th{font-weight:400;font-size:10px;letter-spacing:.14em;color:#8fa6e6;text-align:right;padding:2px 0}
#report th:first-child,#report td:first-child{text-align:left}
#report td{text-align:right;padding:3px 0;color:#fff;font-weight:300}
#report .btns{display:flex;gap:16px;margin-top:16px;justify-content:center}
#report .oct{position:relative;width:280px;height:50px;font-size:13px;letter-spacing:.16em;--fg:#e9f1ff;--bd:#4aa8ff}
#report .note{font-size:11.5px;color:#9fb2e6;margin-top:10px;text-align:center;letter-spacing:.03em}

/* messages */
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:none;align-items:flex-start;gap:12px;z-index:9;max-width:min(780px,88vw);
  padding:12px 20px;border:1px solid var(--poor);border-radius:6px;font-size:14px;line-height:1.45;color:#ffe3ea;
  background:linear-gradient(90deg,rgba(90,10,45,.96),rgba(34,8,60,.96));box-shadow:0 0 22px rgba(255,70,120,.5)}
#toast *{position:static}
#toast svg{width:24px;height:24px;flex:none;color:var(--poor)}
#toast.info{border-color:var(--cyan);color:#e6faff;background:linear-gradient(90deg,rgba(10,50,100,.96),rgba(20,20,70,.96));box-shadow:0 0 22px rgba(56,225,255,.45)}
#toast.info svg{color:var(--cyan)}

/* ===== LOOK SWITCH (both looks) ===== */
.g{display:contents}
.clean-only{display:none}
#lookSw{left:22px;top:14px;z-index:5;display:flex;align-items:center;gap:10px;height:32px;padding:0 14px 0 8px;border:1px solid rgba(154,107,255,.7);border-radius:16px;background:rgba(3,8,50,.85);color:#cfe0ff;font:600 11.5px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
#lookSw .trk{position:relative;display:block;width:34px;height:18px;border-radius:9px;background:#3a2fbf;border:1px solid #7fb0ff;transition:background .15s}
#lookSw .trk i{position:absolute;top:2px;left:18px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
#lookSw .lbl{position:static}
#lookSw[aria-checked="false"] .trk{background:#6b7a8c}
#lookSw[aria-checked="false"] .trk i{left:3px}
#lookSw:focus-visible{outline:2px solid #35e6ff;outline-offset:2px}

/* ===== CLEAN LOOK ===== (everything below only applies when data-look="clean") */
html[data-look="clean"]{
  --ink:#23272b;--muted:#5b6168;--line:#e2ddd0;--card:#fbf9f4;--panel:#ffffff;--soft:#f3f0e8;
  --green:#2f6b4f;--green-d:#24543e;--green-l:#e4efe8;--amber:#8a5a00;--amber-dot:#c58a1b;--red:#b3402f;
  --font-clean:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --b-delta:#2a6fb0;--b-theta:#7a56b8;--b-alpha:#1f8a8a;--b-beta:#8a7a1f;--b-gamma:#b8506a;
  --cv-grid:rgba(35,39,43,.10);--cv-text:#5b6168;--cv-mid:rgba(35,39,43,.14);--cv-err:#b3402f;--cv-raw:#2a6fb0;--cv-hr:#b3402f;--cv-muted:#9aa0a6;
  --text:var(--ink);--dim:var(--muted);--lav:var(--muted);--good:#2f8a5f;--fair:#c58a1b;--poor:#b3402f;
  --font:var(--font-clean);
  background:radial-gradient(ellipse 60% 50% at 88% -8%,rgba(255,255,255,.6),transparent 70%),linear-gradient(180deg,#4d9de0 0%,#86c1ee 42%,#c4e1f5 78%,#e8f3fa 100%) fixed;
}
[data-look="clean"] body{background:transparent;color:var(--ink)}
[data-look="clean"] #stage{background:none;display:grid;padding:60px;
  grid-template-columns:190px 190px minmax(0,1fr) 260px 118px 236px;
  grid-template-rows:100px repeat(5,minmax(0,1fr)) 92px 84px;gap:14px 16px;align-items:stretch}
[data-look="clean"] .cov{display:none!important}
[data-look="clean"] .clean-only{display:block}
[data-look="clean"] #cCard{display:block;position:absolute;left:28px;top:28px;right:28px;bottom:28px;overflow:hidden;background:var(--card);border:1px solid rgba(255,255,255,.7);border-radius:18px;box-shadow:0 18px 50px rgba(20,60,100,.28),0 2px 6px rgba(20,60,100,.12);z-index:-1}
[data-look="clean"] #lookSw{left:60px;top:44px;background:rgba(255,255,255,.88);border-color:rgba(35,39,43,.25);color:var(--ink);font-weight:600}
[data-look="clean"] #lookSw .trk{background:#bfc5cb;border-color:#9aa0a6}
[data-look="clean"] #lookSw[aria-checked="true"] .trk{background:var(--green);border-color:var(--green-d)}
[data-look="clean"] #lookSw:focus-visible{outline-color:var(--green)}
[data-look="clean"] #bandlayer{display:contents}
[data-look="clean"] #stage .g{display:flex;position:static}

/* header */
[data-look="clean"] #cBrand{position:static;align-self:end;grid-row:1;grid-column:1/3;display:flex;align-items:center;gap:14px}
[data-look="clean"] #cBrand .mono{position:static;display:grid;place-items:center;width:54px;height:54px;border-radius:12px;background:var(--ink);color:#fff;font:700 28px/1 Georgia,"Times New Roman",serif}
[data-look="clean"] #cBrand .ttl{position:static;display:flex;flex-direction:column;gap:3px}
[data-look="clean"] #cBrand b{position:static;font:700 24px/1 var(--font-clean);letter-spacing:.06em;color:var(--ink)}
[data-look="clean"] #cBrand em{position:static;font:600 11px/1 var(--font-clean);letter-spacing:.2em;color:var(--muted);font-style:normal}
[data-look="clean"] #cUW{position:static;grid-row:1;grid-column:5/7;justify-self:end;align-self:end;margin-bottom:14px;text-align:right;font:600 10.5px/1.4 var(--font-clean);letter-spacing:.16em;color:var(--muted)}
[data-look="clean"] #gPill{grid-row:1;grid-column:3;justify-self:start;align-self:end;margin-bottom:3px;min-width:250px;padding:10px 18px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
[data-look="clean"] #pillIn{position:static;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;width:auto!important;height:auto!important}
[data-look="clean"] #lamp{position:static;grid-row:1/3;transform:none;width:12px;height:12px;border-radius:50%;box-shadow:none;border:0;background:#9aa0a6}
[data-look="clean"] #lamp.on{background:var(--good)}
[data-look="clean"] #lamp.search{background:var(--amber-dot);animation:pulse 1.1s infinite}
[data-look="clean"] #lamp.bad{background:var(--red)}
[data-look="clean"] #statusText{position:static;font:600 13px/1.2 var(--font-clean);letter-spacing:.12em;color:var(--ink)}
[data-look="clean"] #rate{position:static;font-size:11.5px;color:var(--muted);letter-spacing:.02em;min-height:14px}
[data-look="clean"] #gBat{grid-row:1;grid-column:3;justify-self:end;align-self:end;margin-bottom:13px}
[data-look="clean"] #batIn{position:static;display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:center;width:auto!important;height:auto!important}
[data-look="clean"] .blbl{position:static;grid-column:1/3;font:600 10px/1 var(--font-clean);letter-spacing:.2em;color:var(--muted);margin-bottom:6px}
[data-look="clean"] .bat{position:static;width:140px;height:12px;border:1px solid #b9b4a6;border-radius:6px;padding:1px;background:#fff;overflow:hidden}
[data-look="clean"] .bat i{background:var(--green);box-shadow:none;border-radius:5px}
[data-look="clean"] #batText{position:static;font:600 15px/1 var(--font-clean);color:var(--ink);letter-spacing:0}
[data-look="clean"] #gSens{grid-row:1;grid-column:4/6;align-self:end;margin-bottom:5px;justify-self:center}
[data-look="clean"] #sensors{position:static;display:flex;gap:8px;width:auto!important;height:auto!important}
[data-look="clean"] .sensor{position:static;width:50px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
[data-look="clean"] .sensor .sl{position:static;width:auto;gap:4px;font:600 9.5px/1 var(--font-clean);letter-spacing:.04em;color:var(--muted)}
[data-look="clean"] .sensor .lamp{width:8px;height:8px;transform:none;border-radius:50%;border:0;background:#c3c7cb}
[data-look="clean"] .sensor .q{position:static;width:auto;font:600 12.5px/1 var(--font-clean);color:var(--ink)}
[data-look="clean"] .sensor.good .lamp{background:var(--good);box-shadow:none}
[data-look="clean"] .sensor.fair .lamp{background:var(--amber-dot);box-shadow:none}
[data-look="clean"] .sensor.poor .lamp{background:var(--red);box-shadow:none}
[data-look="clean"] .sensor.hr .sl{color:var(--muted)}
[data-look="clean"] .sensor.poor .q{color:var(--red)}
[data-look="clean"] .sensor.fair .q{color:var(--amber)}

/* sidebar */
[data-look="clean"] #gSess{grid-row:2/7;grid-column:1;flex-direction:column;padding:18px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
[data-look="clean"] #sessIn{position:static;display:flex;flex-direction:column;gap:4px;width:100%!important;height:100%!important}
[data-look="clean"] #sessIn>*{position:static!important;width:auto!important}
[data-look="clean"] .ptitle,[data-look="clean"] .pk{font:600 10.5px/1.3 var(--font-clean);letter-spacing:.16em;color:var(--muted);white-space:normal}
[data-look="clean"] .ptitle{margin-bottom:4px;color:var(--ink)}
[data-look="clean"] .pv{font:600 22px/1.2 var(--font-clean);color:var(--ink);margin-bottom:14px;font-variant-numeric:tabular-nums}
[data-look="clean"] #sessM{font:500 12px/1.4 var(--font-clean);letter-spacing:0;color:var(--muted);margin-top:auto}
[data-look="clean"] #sessM[data-idle]{display:none}

/* band rows */
[data-look="clean"] .row0{grid-row:2}[data-look="clean"] .row1{grid-row:3}[data-look="clean"] .row2{grid-row:4}[data-look="clean"] .row3{grid-row:5}[data-look="clean"] .row4{grid-row:6}

<script>
"use strict";
/* ============ constants ============ */
const FS = 256, PKT = 12;
const SVC = "0000fe8d-0000-1000-8000-00805f9b34fb";
const U = n => "273e" + n + "-4c4d-454d-96be-f03bac821358";
const CTRL = U("0001"), TELE = U("000b");
const EEG = [U("0003"), U("0004"), U("0005"), U("0006")];
const PPG_IR = U("0010"); // pulse sensor, infrared channel (muse-js: 000f ambient, 0010 infrared, 0011 red)
const PPG_FS = 64, PPG_PKT = 6;
const SENSORS = ["TP9","AF7","AF8","TP10"];
const SENSOR_SUB = ["Left ear","Left forehead","Right forehead","Right ear"];
// stage geometry follows the reference picture (1672 x 941)
const BANDS = [
  {key:"delta", name:"Delta", range:[1,4],   color:"#58b4ff", wave:[484,252,510,70], rmsY:312, L:304, mc:325},
  {key:"theta", name:"Theta", range:[4,8],   color:"#d06bff", wave:[484,336,510,69], rmsY:394, L:369, mc:398},
  {key:"alpha", name:"Alpha", range:[8,13],  color:"#35e6ff", wave:[484,421,510,66], rmsY:479, L:443, mc:473},
  {key:"beta",  name:"Beta",  range:[13,30], color:"#a58bff", wave:[484,505,510,65], rmsY:562, L:518, mc:546},
  {key:"gamma", name:"Gamma", range:[30,44], color:"#ff55e6", wave:[484,585,510,62], rmsY:643, L:592, mc:619}
];
const BUF_LEN = FS*4;
const RAW_SCALE = 200;
const params = new URLSearchParams(location.search);
const DEMO = params.get("demo") === "1", DROP = params.get("drop") === "1";
const $ = id => document.getElementById(id);

/* ============ state ============ */
const S = {
  device:null, connected:false, connecting:false, userDisconnected:false, fails:0, everConnected:false,
  maps:[new Map(),new Map(),new Map(),new Map()], seqLast:[null,null,null,null], seqAbs:[0,0,0,0],
  nextIdx:null, maxIdx:-1, alignMode:"seq", qArr:[[],[],[],[]], stall:0, lastEmitted:0,
  emitted:0, lostSamples:0, cnt:0, arrIdx:0,
  hp:[{x:0,y:0},{x:0,y:0},{x:0,y:0},{x:0,y:0}], rms:[null,null,null,null], rmsAcc:[{s:0,n:0},{s:0,n:0},{s:0,n:0},{s:0,n:0}],
  pct:[null,null,null,null], usable:4, artUntil:0,
  raw:[0,1,2,3].map(()=>new Float32Array(BUF_LEN)), rawPos:0,
  rec:null, view:"bands", pip:null, k:1, gapAt:-1e9, holdUntil:0
};
function biquad(f0,Q){return biquadFs(f0,Q,FS);}
function biquadFs(f0,Q,fs){
  const w=2*Math.PI*f0/fs, a=Math.sin(w)/(2*Q), c=Math.cos(w), a0=1+a;
  return {b0:a/a0,b2:-a/a0,a1:-2*c/a0,a2:(1-a)/a0,x1:0,x2:0,y1:0,y2:0,
    p(x){const y=this.b0*x+this.b2*this.x2-this.a1*this.y1-this.a2*this.y2;this.x2=this.x1;this.x1=x;this.y2=this.y1;this.y1=y;return y;}};
}
function makeFilters(b){const f0=Math.sqrt(b.range[0]*b.range[1]),Q=f0/(b.range[1]-b.range[0]);b.f1=biquad(f0,Q);b.f2=biquad(f0,Q);}
BANDS.forEach(b=>{b.buf=new Float32Array(BUF_LEN);b.pos=0;b.gain=1;b.muted=false;b.scale=null;b.energy=0;b.eN=0;b.power=0;b.e2=0;b.n2=0;makeFilters(b);});

/* ============ pulse (heart rate) ============
   Infrared pulse sensor on the forehead, 64 readings per second. Offset removed, then a 0.7-3.5 Hz pass band.
   Rate = strongest repeat period in the last 8 s (normalised autocorrelation); shown only when the repeat is clear, otherwise "--". */
const PL={seqLast:null,lost:0,packets:0,lastAt:0,n:0,hp:{x:null,y:0},f1:null,f2:null,
  raw:new Float32Array(PPG_FS*4),rawPos:0,bp:new Float32Array(PPG_FS*8),mk:new Uint8Array(PPG_FS*8),skip:0,bpPos:0,filled:0,
  scaleRaw:null,scaleBp:null,hist:[],bpm:null,pct:null,r:0,bad:0,state:"--",since:0,warned:false,fallback:false};
function ppgFilters(){const f0=Math.sqrt(0.7*3.5),Q=f0/(3.5-0.7);PL.f1=biquadFs(f0,Q,PPG_FS);PL.f2=biquadFs(f0,Q,PPG_FS);}
function ppgSignalReset(){PL.hp.x=null;PL.hp.y=0;ppgFilters();PL.n=0;PL.raw.fill(0);PL.bp.fill(0);PL.mk.fill(0);PL.skip=0;PL.rawPos=0;PL.bpPos=0;PL.filled=0;PL.hist=[];PL.bpm=null;PL.pct=null;PL.bad=0;PL.scaleRaw=null;PL.scaleBp=null;}
function ppgFullReset(){PL.seqLast=null;PL.lost=0;PL.packets=0;PL.lastAt=0;PL.since=Date.now();PL.warned=false;PL.state="--";ppgSignalReset();}
ppgFullReset();
function onPpg(seq,vals){
  PL.lastAt=Date.now();PL.packets++;
  if(PL.seqLast!=null){const d=(seq-PL.seqLast)&0xffff;if(d===0)return;
    if(d>1){PL.lost+=d-1;
      if(d>2)ppgSignalReset();
      else if(PL.n>=PPG_FS*2){ // 1-2 packets missing: leave an empty stretch in the timeline, never fill it in
        for(let k=0;k<(d-1)*PPG_PKT;k++){PL.raw[PL.rawPos]=NaN;PL.rawPos=(PL.rawPos+1)%PL.raw.length;PL.bp[PL.bpPos]=NaN;PL.mk[PL.bpPos]=0;PL.bpPos=(PL.bpPos+1)%PL.bp.length;if(PL.filled<PL.bp.length)PL.filled++;}
        PL.skip=24; // the filter needs a moment to settle after a gap
      }}}
  PL.seqLast=seq;
  for(const x of vals){
    const h=PL.hp;if(h.x==null){h.x=x;h.y=0;}
    const y=x-h.x+0.995*h.y;h.x=x;h.y=y;PL.n++;
    const b=PL.f2.p(PL.f1.p(y));
    if(PL.n<PPG_FS*2)continue; // first 2 s: offset removal and filters still settling, not shown
    PL.raw[PL.rawPos]=y;PL.rawPos=(PL.rawPos+1)%PL.raw.length;
    PL.bp[PL.bpPos]=b;PL.mk[PL.bpPos]=PL.skip>0?0:1;if(PL.skip>0)PL.skip--;PL.bpPos=(PL.bpPos+1)%PL.bp.length;
    if(PL.filled<PL.bp.length)PL.filled++;
  }
}
function ppgAnalyse(){
  if(!S.connected){PL.state="--";PL.bpm=null;PL.pct=null;PL.hist=[];return;}
  const age=Date.now()-PL.lastAt;
  if(PL.packets===0||age>3000){PL.state=(Date.now()-PL.since>10000)?"NO DATA":"WAIT";PL.bpm=null;PL.pct=null;PL.hist=[];return;}
  if(PL.filled<PPG_FS*6){PL.state="WAIT";return;}
  const L=PL.bp.length,n=Math.min(PL.filled,L),x=new Float32Array(n),m=new Uint8Array(n);
  for(let i=0;i<n;i++){const k=(PL.bpPos-n+i+L*2)%L;x[i]=PL.bp[k];m[i]=PL.mk[k];}
  const lo=Math.round(PPG_FS*60/180),hi=Math.round(PPG_FS*60/40),r=new Float32Array(hi+3);
  let best=lo,bv=-1;
  for(let l=lo-1;l<=hi+1;l++){let s=0,e1=0,e2=0; // only pairs where both readings really arrived
    for(let i=0;i+l<n;i++){if(m[i]&m[i+l]){const a=x[i],b=x[i+l];s+=a*b;e1+=a*a;e2+=b*b;}}
    const d=Math.sqrt(e1*e2);r[l]=d>0?s/d:0;
    if(l>=lo&&l<=hi&&r[l]>bv){bv=r[l];best=l;}}
  const hh=Math.round(best/2);
  if(hh>=lo){let hb=hh,hv=-1;for(let l=hh-2;l<=hh+2;l++)if(l>=lo&&l<=hi&&r[l]>hv){hv=r[l];hb=l;}
    if(hv>=0.85*bv){best=hb;bv=hv;}} // a clear repeat at half the period means the true period is the shorter one
  let lag=best;
  if(best>lo&&best<hi){const a=r[best-1],b=r[best],c=r[best+1],den=a-2*b+c;if(den<0)lag=best+0.5*(a-c)/den;}
  const inst=PPG_FS*60/lag,pRaw=Math.max(0,Math.min(1,(bv-0.15)/0.65))*100;
  PL.pct=PL.pct==null?pRaw:PL.pct+0.5*(pRaw-PL.pct);PL.r=bv;
  if(bv>=0.3&&inst>=40&&inst<=180){
    PL.hist.push(inst);if(PL.hist.length>5)PL.hist.shift();PL.bad=0;
    const s=[...PL.hist].sort((p,q)=>p-q);PL.bpm=s[Math.floor(s.length/2)];PL.state=PL.pct>=40?"LIVE":"WEAK";
  }else{PL.bad++;PL.state="WEAK";if(PL.bad>=4){PL.hist=[];PL.bpm=null;}}
}
function hrUi(){
  const on=S.connected,have=on&&PL.bpm!=null;
  $("hrNum").textContent=have?String(Math.round(PL.bpm)):"--";
  $("hrState").textContent=on?PL.state:"--";
  $("hrFill").style.width=have?Math.max(2,Math.min(100,(PL.bpm-40)/140*100))+"%":"0";
  const el=$("sen4"),q=el.querySelector(".q");let cls="",txt="--";
  if(on&&PL.pct!=null&&PL.state!=="NO DATA"&&PL.state!=="WAIT"){const p=Math.round(PL.pct);txt=p+"%";cls=p>=70?"good":p>=40?"fair":"poor";}
  el.className="sensor hr "+cls;q.textContent=txt;
  $("rq4").textContent=txt;$("rr4").textContent=have?Math.round(PL.bpm)+" bpm":"--";
  if(on&&PL.state==="NO DATA"&&!PL.warned){PL.warned=true;toast("No pulse data is coming from the headband yet. Brain signals are fine. Make sure the headband sits snug on your forehead, then press Disconnect and Connect once.","info",9000);}
}

/* ============ build UI on the stage ============ */
const mk=(tag,cls,css,html,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||$("bandlayer")).appendChild(e);return e;};
BANDS.forEach((b,i)=>{
  const [wx,wy,ww,wh]=b.wave;
  // covers hide the picture's sample waves, sliders and mute buttons
  mk("div","clean-only rowbg row"+i,"");
  mk("div","clean-only blab row"+i,"",`<b>${b.name.toUpperCase()}</b><span>${b.range[0]}.0 - ${b.range[1]} Hz</span>`);
  mk("div","cov",`left:${wx-2}px;top:${wy-3}px;width:${ww+4}px;height:${wh+6}px`);
  mk("div","cov dark",`left:1010px;top:${b.L-17}px;width:254px;height:62px`);
  mk("div","cov dark",`left:1284px;top:${b.mc-34}px;width:126px;height:68px`);
  mk("canvas","wave row"+i,`left:${wx}px;top:${wy}px;width:${ww}px;height:${wh}px`).id="cv"+i;
  const rd=mk("div","rd row"+i,`left:285px;top:${b.rmsY-8}px`,"--");rd.id="rd"+i;
  const sb=mk("div","sliderbox row"+i,`left:1012px;top:${b.L-16}px;width:250px;height:58px`,
    `<div class="sn t">STRENGTH</div><div class="sv t" id="sv${i}">100%</div><input type="range" min="0" max="100" value="100" id="sl${i}" aria-label="${b.name} strength">`);
  const mu=mk("button","oct mute row"+i,`left:1290px;top:${b.mc-27}px;--bd:#6a8cff;--glow:rgba(110,150,255,.7)`,"Mute");mu.id="mu"+i;
  const sl=$("sl"+i),upd=()=>{b.gain=sl.value/100;$("sv"+i).textContent=sl.value+"%";sl.style.setProperty("--p",sl.value+"%");};
  sl.addEventListener("input",upd);upd();
  mu.addEventListener("click",()=>{b.muted=!b.muted;mu.textContent=b.muted?"Unmute":"Mute";mu.classList.toggle("on",b.muted);sb.classList.toggle("rowdim",b.muted);$("cv"+i).style.opacity=b.muted?.5:1;});
});
const sensorsEl=$("sensors");
SENSORS.forEach((n,i)=>{const d=mk("div","sensor",`left:${i*39}px`,`<div class="sl"><span class="lamp"></span>${n}</div><span class="q">--</span>`,sensorsEl);d.id="sen"+i;});
{const d=mk("div","sensor hr","left:156px",`<div class="sl"><span class="lamp"></span>HR</div><span class="q">--</span>`,sensorsEl);d.id="sen4";}
/* raw view panel: 4 brain sensors + the pulse sensor */
const rawov=$("rawov");
const RAWROWS=SENSORS.map((n,i)=>({n,sub:SENSOR_SUB[i].toUpperCase(),un:"Unfiltered signal",a:"CONTACT",b:"RMS"}));
RAWROWS.push({n:"HEART",sub:"PULSE (INFRARED)",un:"Offset removed, auto scale",a:"SIGNAL",b:"HEART RATE",hr:true});
RAWROWS.forEach((o,i)=>{
  mk("div","rawrow",`left:0;top:${6+i*79}px;width:1166px;height:76px`,
   `<div class="nm t"${o.hr?' style="color:#ff4a5e"':''}>${o.n}</div><div class="sb t"${o.hr?' style="color:#ff8c9b"':''}>${o.sub}</div><div class="un t">${o.un}</div>
    <canvas class="wave" id="rc${i}" style="left:210px;top:4px;width:700px;height:68px${o.hr?';border-color:rgba(255,70,100,.55)':''}"></canvas>
    <div class="pk t" style="left:930px;top:26px">${o.a}</div><b class="pv t" id="rq${i}" style="left:930px;top:40px">--</b><div class="pk t" style="left:1040px;top:26px">${o.b}</div><b class="pv t" id="rr${i}" style="left:1040px;top:40px${o.hr?';color:#ff3b4e;text-shadow:0 0 10px rgba(255,40,70,.8)':''}">--</b>`,rawov);
});
const FSEG=25,fbar=$("fbar");
for(let i=0;i<FSEG;i++){const s=document.createElement("span");s.style.height=(22+i*(78/(FSEG-1)))+"%";fbar.appendChild(s);}

/* fit the 16:9 stage to the window */
function fit(){const k=Math.min(innerWidth/1672,innerHeight/941),st=$("stage");S.k=k;
  if(document.documentElement.dataset.look==="clean"){ // clean look: the card fills the window, so the borders stay equal at any window shape
    st.style.width=innerWidth/k+"px";st.style.height=innerHeight/k+"px";st.style.transform=`scale(${k})`;}
  else{st.style.width="";st.style.height="";
    st.style.transform=`translate(${(innerWidth-1672*k)/2}px,${(innerHeight-941*k)/2}px) scale(${k})`;}}
fit();addEventListener("resize",fit);

function toast(msg,kind,ms){const t=$("toast");t.className=kind==="info"?"info":"";t.style.display="flex";$("toastText").textContent=msg;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",ms||6000);}
function setStatus(kind,text){$("lamp").className=kind;$("statusText").textContent=text;}
function setButtons(){
  $("btnConnect").disabled=S.connected||S.connecting;
  $("btnDisconnect").disabled=!(S.connected||S.connecting);
  $("btnStart").disabled=!S.connected||!!S.rec;
  $("btnStop").disabled=!S.rec;
}
function setView(v){S.view=v;rawov.classList.toggle("show",v==="raw");$("btnBand").classList.toggle("on",v==="bands");$("btnView").classList.toggle("on",v==="raw");}
$("btnBand").addEventListener("click",()=>setView("bands"));
$("btnView").addEventListener("click",()=>setView("raw"));
$("btnFull").addEventListener("click",()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}});

/* ============ stream handling (no interpolation, nothing invented) ============ */
function resetStream(){
  S.maps.forEach(m=>m.clear());S.seqLast=[null,null,null,null];S.seqAbs=[0,0,0,0];S.nextIdx=null;S.maxIdx=-1;
  S.alignMode="seq";S.qArr=[[],[],[],[]];S.stall=0;S.lastEmitted=0;S.emitted=0;S.lostSamples=0;S.cnt=0;S.arrIdx=0;
  S.hp.forEach(h=>{h.x=0;h.y=0;});S.rms=[null,null,null,null];S.pct=[null,null,null,null];S.rmsAcc.forEach(a=>{a.s=0;a.n=0;});
  S.gapAt=-1e9;S.holdUntil=0;
  S.raw.forEach(a=>a.fill(0));S.rawPos=0;BANDS.forEach(b=>{b.buf.fill(0);b.pos=0;b.scale=null;makeFilters(b);});
  ppgFullReset();
}
function handlePacket(ch,seq,vals){
  S.cnt+=vals.length;
  if(S.alignMode==="arrival"){vals.forEach(v=>S.qArr[ch].push(v));while(S.qArr.every(a=>a.length))emit(S.qArr.map(a=>a.shift()),S.arrIdx++);return;}
  if(S.seqLast[ch]==null){S.seqAbs[ch]=seq;}
  else{const d=(seq-S.seqLast[ch])&0xffff;if(d===0)return;S.seqAbs[ch]+=d;}
  S.seqLast[ch]=seq;

  for(let i=0;i<vals.length;i++)S.maps[ch].set(base+i,vals[i]);

let QC=null;

  if(!S.connected){toast("Connect the headband first, then press CAL.","info");return;}
  if(QC||focus.cal)return;

    if(t<20)return "CAL 1/2: relax your face, eyes open ("+Math.ceil(20-t)+"s)";
    const k=Math.floor((t-20)/10),u=(t-20)%10;

    if(!(r2[nm]>=0.2))return fail("muscle explains too little of beta on "+nm+" (R² "+r2[nm].toFixed(2)+"). Try again.");
    gains[nm]=fit.g;
    ratios=ratios.concat(q.clench.map(w=>w[c].emg/r.emg).filter(v=>v>1));
  }
  const Th=Math.max(3,Math.min(20,ratios.length?quant(ratios,.75):5));
  const c={version:1,fingerprint:PIPE_FP,source:"quick-panel-calibration",created:new Date().toISOString(),rest,gains,r2,T_heavy:Th,T_gate_only:3,floor:0.2,max_removed_frac:0.6,max_hold_s:3,p2p_limit_uV:p2pLim};
  const why=setCal(c);
  if(why)return fail(why);
  try{localStorage.setItem(CKEY,JSON.stringify(c));}catch(e){}
  focus.result="Calibration done (R² "+r2.AF7.toFixed(2)+" / "+r2.AF8.toFixed(2)+"). Press Auto Set Baselines, then pick Corrected or Gate.";
  toast("Muscle calibration done. Corrected and Gate-only are now available.","info",8000);renderFocus();
}
function baseOf(src){ // same baseline recipe as the legacy score (outliers out, 10th/90th percentile, minimum span)
  if(src.length<12)return null;
  const s=[...src].sort((x,y)=>x-y),q1=quantile(s,.25),q3=quantile(s,.75),iqr=q3-q1;
  const inl=s.filter(v=>v>=q1-1.5*iqr&&v<=q3+1.5*iqr);
  let lo=quantile(inl,.10),hi=quantile(inl,.90);
  if(hi-lo<MIN_SPAN){const mid=(lo+hi)/2;lo=mid-MIN_SPAN/2;hi=mid+MIN_SPAN/2;}
  return {lo,hi};
}
function renderFocus(){
  const em=effMode(),p=focusPct(),txt=p==null?"--":String(Math.round(p)),sh=shown();
  $("fnum").textContent=txt;
  [...fbar.children].forEach((s,i)=>s.classList.toggle("lit",p!=null&&i<Math.round(p/100*FSEG)));
  $("fmC").classList.toggle("on",em==="corrected");$("fmL").classList.toggle("on",em==="legacy");
  $("fmG").classList.toggle("on",em==="gate");$("fmG").disabled=!corrOK();$("fmG").title=corrOK()?"Gate-only: new extractor and gate, no subtraction (a proxy, not validated focus)":"Gate-only unavailable: "+CAL_WHY;
  $("fmC").disabled=!corrOK();$("fmC").title=corrOK()?"Muscle-corrected score (a proxy, not validated focus)":"Corrected unavailable: "+CAL_WHY;
  $("fform").innerHTML=em==="legacy"?"LEGACY ln(&beta;&divide;&alpha;)":em==="gate"?"GATE-ONLY (proxy)":"CORRECTED (proxy)";
  let note;
  if(QC)note=QC.msg();
  else if(focus.cal)note=focus.cal.msg();
  else if(!S.connected)note="Connect to use focus";
  else if(S.usable===0)note="No sensor contact";
  else if(sh.lo==null||sh.hi==null)note=focus.result||"Press the button to set baselines";
  else note=focus.result||"Baselines set. Focus is live.";
  const fn=$("fnote");fn.textContent="";
  if(em!=="legacy"){
    const nm=CST_NAMES[sh.st]||"warming up",b=document.createElement("b");b.id="cstat";
    b.className=sh.st===1||sh.st===2?"":sh.st===6?"hold":"rej";b.textContent=nm+(sh.st?(sh.valid?" · valid":" · invalid"):"");
    fn.appendChild(b);
  }
  fn.appendChild(document.createTextNode(note+(MODE_PREF!=="legacy"&&!corrOK()?" "+MODE_NAME[MODE_PREF]+" unavailable: "+CAL_WHY+". Showing Legacy.":(!corrOK()?" (Corrected and Gate-only off: "+CAL_WHY+". Press CAL)":""))));
  $("btnCal").disabled=!(S.connected&&!focus.cal);
  $("btnCal").classList.toggle("on",sh.lo!=null&&sh.hi!=null&&!focus.cal);
  if(S.pip){S.pip.num.textContent=txt;[...S.pip.bar.children].forEach((s,i)=>s.classList.toggle("lit",p!=null&&i<Math.round(p/100*FSEG)));S.pip.note.textContent=p==null?(S.connected?(sh.lo==null?"Set baselines in the panel":em.toUpperCase()+": no valid reading"):"Not connected"):em.toUpperCase();}
  sendGame(p);
  updateMarioBtn();
}
/* ============ Mario Kart game (game/mkds.js, game/mkds-render.js) ============ */
function marioReady(){const f=shown();return f.lo!=null&&f.hi!=null&&f.hi-f.lo>=0.05;}
function updateMarioBtn(){
  const b=$("btnMario");if(!b)return;const ok=marioReady()&&!(window.MKDSUI&&MKDSUI.isOpen());
  b.disabled=!marioReady();b.style.opacity=marioReady()?"1":".45";b.style.cursor=marioReady()?"pointer":"not-allowed";
  b.title=marioReady()?"Play Mario Kart (focus controls your speed)":"Set focus baselines first";
  $("btnMarioNote").textContent=marioReady()?(S.connected?"MARIO KART":"KART (HEADBAND OFF)"):"KART: SET BASELINES";
}
function openMario(){
  if(!marioReady()||!window.MKDSUI||MKDSUI.isOpen())return;
  MKDSUI.open({stage:$("stage"),
    focus:()=>S.connected?focusPct():null,
    sensors:()=>SENSORS.map((nm,i)=>{const p=S.connected&&S.emitted>0&&S.pct[i]!=null?Math.round(S.pct[i]):null;return{txt:p==null?"--":p+"%",cls:p==null?"":p>=70?"good":p>=40?"fair":"poor"};}),
    status:()=>S.connected?(S.emitted>0?"Muse live":"Muse waiting"):"Muse not connected",
    onClose:updateMarioBtn});
  updateMarioBtn();
}
document.addEventListener("click",e=>{if(e.target&&e.target.id==="btnMario")openMario();});
/* ============ game link: the focus meter (0-100) is sent to the game running on this computer ============ */
const GAME_URL="http://127.0.0.1:8765/";
let gameBusy=false,gameLast=0,gameOk=false;
function sendGame(p){
  const now=Date.now();
  if(gameBusy||now-gameLast<(gameOk?230:2000))return;
  gameLast=now;gameBusy=true;
  const opt=S.connected?{method:"POST",mode:"cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({focus:p==null?null:Math.round(p*10)/10,mode:effMode(),sensors:S.pct.map(v=>v==null?null:Math.round(v))})}:{method:"GET",mode:"cors"};
  fetch(GAME_URL,opt).then(r=>{gameOk=r.ok;}).catch(()=>{gameOk=false;}).finally(()=>{
    gameBusy=false;const e=$("gameLink");
    e.textContent=gameOk?"GAME: LINKED":"GAME: OFF";e.style.color=gameOk?"#35e6ff":"#6f82c4";e.dataset.state=gameOk?"on":"off";});
}
function startCal(){
  if(!S.connected||focus.cal||QC)return;const t0=Date.now();focus.result="";
  focus.cal={t0,vals:[],all:[],valsC:[],valsG:[],msg(){const left=Math.max(0,CAL_SEC-(Date.now()-t0)/1000);return "RECORDING "+Math.ceil(left)+"s. Drift from relaxed to concentrating";}};
  renderFocus();
}
function finishCal(){
  const c=focus.cal;focus.cal=null;
  const src=c.vals.length>=20?c.vals:c.all;
  if(src.length<12){focus.result="No usable signal in the 10 seconds. Check the sensor percentages and press again.";renderFocus();return;}
  const s=[...src].sort((x,y)=>x-y),q1=quantile(s,.25),q3=quantile(s,.75),iqr=q3-q1;
  const inl=s.filter(v=>v>=q1-1.5*iqr&&v<=q3+1.5*iqr);
  let lo=quantile(inl,.10),hi=quantile(inl,.90),note="Baselines set. Focus is live.";
  if(hi-lo<MIN_SPAN){const mid=(lo+hi)/2;lo=mid-MIN_SPAN/2;hi=mid+MIN_SPAN/2;note="Baselines set (small change seen). Press again and shift your focus more for a wider range.";}
  focus.lo=lo;focus.hi=hi;focus.result=note;
  if(CAL){for(const [s,v,nm] of [[fc,c.valsC,"Corrected"],[fg,c.valsG,"Gate-only"]]){const b=baseOf(v);if(b){s.lo=b.lo;s.hi=b.hi;}else{s.lo=s.hi=null;focus.result+=" "+nm+": too few valid windows, so its baselines were not set (muscle or blinks?). Press again.";}}}
  renderFocus();
}
setInterval(()=>{
  const a=BANDS[2],b=BANDS[3],ok=a.n2>=20&&b.n2>=20;
  const am=ok?a.e2/a.n2:0,bm=ok?b.e2/b.n2:0;a.e2=a.n2=b.e2=b.n2=0;
  if(!S.connected){QC=null;focus.ema=null;focus.fast=null;focus.cal=null;focus.raw=null;for(const s of [fc,fg]){s.ema=s.fast=null;s.valid=false;s.st=0;s.lastValidT=-1e9;}renderFocus();return;}
  if(ok&&S.usable>0){
    const F=Math.log((bm+1e-3)/(am+1e-3));focus.raw=F;
    focus.ema=focus.ema==null?F:focus.ema+0.08*(F-focus.ema);
    focus.fast=focus.fast==null?F:focus.fast+0.22*(F-focus.fast);
    if(focus.cal){focus.cal.all.push(focus.fast);if(Date.now()>S.artUntil)focus.cal.vals.push(focus.fast);}
  }
  if(focus.cal&&(Date.now()-focus.cal.t0)/1000>=CAL_SEC)finishCal();
  renderFocus();
},250);
$("btnCal").addEventListener("click",startCal);
$("fmL").addEventListener("click",()=>setMode("legacy"));
$("fmC").addEventListener("click",()=>setMode("corrected"));
$("fmG").addEventListener("click",()=>setMode("gate"));
$("fmLoad").addEventListener("click",e=>{if(e.shiftKey)$("calFile").click();else startQuickCal();});
$("calFile").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  f.text().then(txt=>{
    let c=null,why="";try{c=JSON.parse(txt);}catch(err){why="Calibration file is not valid JSON";}
    if(!why)why=calibCheck(c);
    if(why){CAL_WHY=why;toast("Calibration rejected: "+why,"info");}
    else{setCal(c);try{localStorage.setItem(CKEY,txt);}catch(err){}toast("Calibration loaded. Corrected is available. Press Auto Set Baselines to set its range.","info");}
    renderFocus();
  });
});
loadSavedCal();renderFocus();

/* ============ floating focus meter (small always-on-top window) ============ */
const PIP_CSS=`
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 20% 0%,#2a1d6e,#050a26 65%);color:#eaf3ff;font-family:"Segoe UI",sans-serif;padding:10px 14px;height:100vh;overflow:hidden;border:1px solid #6a5cff}
.t{font-size:11px;letter-spacing:.34em;color:#8fa6ff}
.n{font-size:46px;font-weight:300;line-height:1.05;text-shadow:0 0 14px rgba(120,150,255,.9)}
.b{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:4px}
.b span{flex:1;background:rgba(60,50,190,.45);border:1px solid rgba(140,120,255,.55)}
.b span.lit{background:linear-gradient(0deg,#9a4bff,#3fd6ff 70%,#fff);border-color:#7fe6ff}
.s{font-size:11px;color:#9fb2e6;margin-top:3px;min-height:14px;letter-spacing:.04em}`;
async function toggleFloat(){
  if(S.pip){S.pip.w.close();return;}
  if(!("documentPictureInPicture" in window)){toast("The floating meter needs Microsoft Edge or Chrome, version 116 or newer.","error");return;}
  try{
    const w=await documentPictureInPicture.requestWindow({width:300,height:136});
    try{w.moveTo(screen.availLeft+screen.availWidth-320,screen.availTop+8);}catch(e){}
    const st=w.document.createElement("style");st.textContent=PIP_CSS;w.document.head.appendChild(st);
    w.document.body.innerHTML=`<div class="t">FOCUS</div><div class="n" id="n">--</div><div class="b" id="b"></div><div class="s" id="s"></div>`;
    const bar=w.document.getElementById("b");for(let i=0;i<FSEG;i++){const s=w.document.createElement("span");s.style.height=(22+i*(78/(FSEG-1)))+"%";bar.appendChild(s);}
    S.pip={w,num:w.document.getElementById("n"),bar,note:w.document.getElementById("s")};
    $("btnFloat").classList.add("on");$("btnFloat").lastChild.textContent="Close float";
    w.addEventListener("pagehide",()=>{S.pip=null;$("btnFloat").classList.remove("on");$("btnFloat").lastChild.textContent="Float focus";});
    renderFocus();
    toast("Floating meter is on. Minimize this panel (do not close it) and the meter stays on top. Drag it to the top right if you like.","info",9000);
  }catch(e){console.error(e);toast("Could not open the floating meter. Press the button again.","error");}
}
$("btnFloat").addEventListener("click",toggleFloat);

if(params.get("view")==="raw")setView("raw");

addEventListener("beforeunload",()=>{try{if(S.device&&S.device.gatt.connected)S.device.gatt.disconnect();}catch(e){}});
