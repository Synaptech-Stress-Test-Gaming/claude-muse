<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse 2 Control Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="panel/ui.css">
</head>
<body>
<div id="stage">
  <!-- header status (inside the baked status pill) -->
  <div class="cov dark" style="left:506px;top:150px;width:276px;height:46px"></div>
  <div style="left:506px;top:150px;width:276px;height:46px"><div id="lamp" class="bad"></div><div id="statusText" class="t">Starting</div><div id="rate" class="t"></div></div>

  <!-- battery -->
  <div class="cov bar" style="z-index:3;left:968px;top:234px;width:228px;height:46px"></div>
  <div style="z-index:4;left:974px;top:238px;width:218px;height:42px"><div class="blbl t">BATTERY</div><div class="bat"><i id="batFill"></i></div><div id="batText" class="t">--</div></div>
  <!-- sensors -->
  <div class="cov dark" style="z-index:3;left:1198px;top:229px;width:204px;height:52px"></div>
  <div id="sensors" style="z-index:4;left:1204px;top:238px;width:196px;height:42px"></div>

  <!-- band rows: covers + live elements are built by script -->
  <div id="bandlayer" style="left:0;top:0;width:1672px;height:941px"></div>

  <div id="report"></div>
  <!-- raw view -->
  <div id="rawov"></div>

  <!-- focus -->
  <div class="cov dark" style="left:290px;top:686px;width:252px;height:68px"></div>
  <div class="fname t" style="left:298px;top:688px">FOCUS</div>
  <div class="fform t" style="left:300px;top:716px">ln( &beta; &divide; &alpha; )</div>
  <div id="fnote" style="left:300px;top:733px">Connect to use focus</div>
  <div id="gameLink" class="t" style="left:420px;top:694px;font-size:9.5px;letter-spacing:.14em;color:#6f82c4">GAME: OFF</div>
  <div class="cov bar" style="left:546px;top:672px;width:508px;height:80px"></div>
  <div id="fnum" class="t" style="left:552px;top:704px">--</div>
  <div id="fbar" style="left:606px;top:680px;width:428px;height:64px"></div>
  <div class="cov dark" style="left:1068px;top:688px;width:328px;height:60px"></div>
  <button class="oct" id="btnCal" disabled style="left:1076px;top:692px;width:312px;height:52px;--fg:#cfe7ff;--bd:#4aa8ff;font-size:11.5px;letter-spacing:.16em;line-height:1.35;gap:14px">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6fd0ff" stroke-width="1.6" stroke-linecap="round" style="width:26px;height:26px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>AUTO SET BASELINES<br>10 SECONDS</span></button>

  <!-- primary controls -->
  <div class="cov" style="left:290px;top:779px;width:244px;height:86px"></div>
  <div class="cov dark" style="left:578px;top:779px;width:248px;height:86px"></div>
  <div class="cov" style="left:868px;top:779px;width:236px;height:86px"></div>
  <div class="cov dark" style="left:1138px;top:779px;width:248px;height:86px"></div>
  <button class="oct bigbtn" id="btnConnect" style="left:296px;top:793px;width:232px;--fg:#35e6ff;--bd:#35e6ff;--glow:rgba(53,230,255,.9);--bg:linear-gradient(180deg,#0a3a9a,#04186a)">
    <svg viewBox="0 0 24 24" style="width:34px;height:34px"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg><span>Connect</span></button>
  <button class="oct bigbtn" id="btnDisconnect" disabled style="left:584px;top:793px;width:236px;--fg:#a9b8ee;--bd:#5f78d8;--glow:rgba(110,140,255,.6)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:28px;height:28px"><circle cx="12" cy="12" r="9"/><path d="M9 14a2.2 2.2 0 0 0 3.1 0l1.6-1.6a2.2 2.2 0 0 0-3.1-3.1l-.5.5M14 10a2.2 2.2 0 0 0-3.1 0L9.3 11.6a2.2 2.2 0 0 0 3.1 3.1l.5-.5"/></svg><span>Disconnect</span></button>
  <button class="oct bigbtn" id="btnStart" disabled style="left:874px;top:793px;width:224px;--fg:#c9bbff;--bd:#7a62e8;--glow:rgba(255,77,157,.6);font-size:15px;line-height:1.3">
    <svg viewBox="0 0 24 24" style="width:30px;height:30px"><circle cx="12" cy="12" r="9" fill="none" stroke="#ff4d9d" stroke-width="2"/><circle cx="12" cy="12" r="4.4" fill="#ff4d9d"/></svg><span>Start<br>Recording</span></button>
  <button class="oct bigbtn" id="btnStop" disabled style="left:1144px;top:793px;width:236px;--fg:#c9bbff;--bd:#7a62e8;--glow:rgba(208,92,255,.6);font-size:15px;line-height:1.3">
    <svg viewBox="0 0 24 24" style="width:30px;height:30px"><circle cx="12" cy="12" r="9" fill="none" stroke="#d05cff" stroke-width="1.6"/><rect x="8" y="8" width="8" height="8" rx="1.4" fill="none" stroke="#d05cff" stroke-width="2"/></svg><span>Stop<br>Recording</span></button>

  <!-- left: session -->
  <div class="cov dark" style="left:64px;top:354px;width:98px;height:182px"></div>
  <div style="left:64px;top:354px;width:98px;height:182px">
    <div class="ptitle" style="left:12px;top:14px">SESSION</div>
    <div id="sessT" class="pv t" style="left:12px;top:38px;font-size:22px">--:--</div>
    <div class="pk" style="left:12px;top:72px">READINGS</div>
    <div id="sessN" class="pv t" style="left:12px;top:88px;font-size:15px">--</div>
    <div class="pk" id="sessM" style="left:12px;top:122px;width:80px;white-space:normal;line-height:1.4">File saves when you stop</div>
  </div>

  <!-- right: heart rate + stream readout -->
  <div class="cov dark" style="left:1464px;top:250px;width:179px;height:124px"></div>
  <div style="left:1464px;top:250px;width:172px;height:124px">
    <div class="hrname" style="left:10px;top:6px">HEART RATE</div><div id="hrState" style="right:6px;top:7px">--</div>
    <div id="hrNum" style="left:10px;top:20px">--</div><div class="pk" style="left:88px;top:40px;color:#ff8c9b">BPM</div>
    <canvas id="hrCv" class="hrcv" style="left:10px;top:62px;width:154px;height:30px"></canvas>
    <div class="hrbar" style="left:10px;top:97px;width:154px"><i id="hrFill"></i></div>
    <div class="pk" style="left:10px;top:110px;font-size:9px;letter-spacing:.06em"><span id="stRate" class="inl">-- Hz</span> &middot; <span id="stDrop" class="inl">--% lost</span> &middot; <span id="stUse" class="inl">-/4 in use</span></div>
  </div>

  <!-- right: arousal (body activation). Click for details. Drawn by panel/arousal-link.js -->
  <div class="cov dark" style="left:1464px;top:378px;width:179px;height:130px"></div>
  <div id="arBox" title="Arousal: click for details" style="left:1464px;top:378px;width:172px;height:130px">
    <div class="arname" style="left:10px;top:6px">AROUSAL</div><div id="arState" style="right:6px;top:7px">--</div>
    <div id="arNum" style="left:10px;top:20px">--</div><div class="pk" style="left:88px;top:40px;color:#ffc27a">BODY</div>
    <div class="arbar" style="left:10px;top:64px;width:154px"><i id="arFill"></i></div>
    <div class="arsig" style="left:10px;top:82px;width:154px"><span id="arH" class="inl"><i class="inl"></i>HEART</span><span id="arT" class="inl"><i class="inl"></i>MUSCLE</span><span id="arM" class="inl"><i class="inl"></i>MOVE</span></div>
    <div class="pk" id="arNote" style="left:10px;top:106px;font-size:9px;letter-spacing:.04em">connect to use</div>
  </div>

  <!-- right: view buttons -->
  <div class="cov dark" style="left:1462px;top:512px;width:130px;height:258px"></div>
  <button class="oct smallbtn on" id="btnBand" style="left:1465px;top:517px;--fg:#dbe8ff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12c3-9 5 9 8 0s5 9 8 0 3 4 4 3"/></svg>Band view</button>
  <button class="oct smallbtn" id="btnView" style="left:1465px;top:559px;--fg:#dbe8ff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h3l2-6 3 12 3-9 2 5 2-2h5"/></svg>Raw view</button>
  <button class="oct smallbtn" id="btnFloat" style="left:1465px;top:601px;--fg:#dbe8ff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" fill="currentColor"/></svg>Float focus</button>
  <button class="oct smallbtn" id="btnFull" style="left:1465px;top:643px;--fg:#dbe8ff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fullscreen</button>

  <!-- game launcher: Mario Kart (needs focus baselines) -->
  <button class="oct smallbtn" id="btnMario" title="Open the game menu" style="left:1465px;top:685px;--fg:#dbe8ff"><svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M16 4h32c8 0 14 8 15 18 1 8-3 14-9 14-5 0-8-5-11-9H21c-3 4-6 9-11 9-6 0-10-6-9-14C2 12 8 4 16 4z"/><path d="M18 14v10M13 19h10"/><circle cx="43" cy="16" r="2.4" fill="currentColor"/><circle cx="50" cy="22" r="2.4" fill="currentColor"/></svg>Games</button>
  <button class="oct smallbtn" id="btnGuide" title="Step-by-step setup guide" style="left:1465px;top:727px;--fg:#dbe8ff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17v.2"/></svg>Guide</button>
</div>
<script src="game/bomb-logic.js"></script>
<script src="game/bomb.js"></script>
<script src="game/menu.js"></script>
<div id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18v.5" stroke-linecap="round"/></svg><span id="toastText"></span></div>

<script src="panel/core.js"></script>
<script src="panel/pulse.js"></script>
<script src="panel/motion.js"></script>
<script src="panel/ui.js"></script>
<script src="panel/dsp.js"></script>
<script src="panel/ble.js"></script>
<script src="panel/focus.js"></script>
<script src="panel/recording.js"></script>
<script src="panel/gamelink.js"></script>
<script src="panel/main.js"></script>
<script src="arousal.js"></script>
<script src="panel/arousal-link.js"></script>
<script src="panel/guide.js"></script>
</body>
</html>
